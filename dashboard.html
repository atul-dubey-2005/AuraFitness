<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Aura Fitness</title>
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aura Fitness — log workouts, track progress and follow routines, right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2314171a%22/%3E%3Cpath d=%22M30 62 L46 62 L40 82 L74 46 L56 46 L64 18 Z%22 fill=%22%23c8ff3d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1 id="greeting">Welcome back</h1>
      <p id="dateline"></p>
    </div>
    <a href="log-workout.html" class="btn btn-primary">Log a workout</a>
  </div>

  <div class="stat-grid">
    <div class="stat hero">
      <div class="k">Workouts this month</div>
      <div class="v" id="stat-workouts">0</div>
    </div>
    <div class="stat tint">
      <div class="k">Calories burned</div>
      <div class="v" id="stat-calories">0<span class="u">kcal</span></div>
    </div>
    <div class="stat plain">
      <div class="k">Average intensity</div>
      <div class="v" id="stat-intensity" style="font-size:26px;">—</div>
    </div>
    <div class="stat plain">
      <div class="k">Current weight</div>
      <div class="v" id="stat-weight" style="font-size:26px;">—</div>
    </div>
  </div>

  <div class="dash-grid">
    <section class="panel">
      <div class="panel-title">
        <h2>Recent workouts</h2>
        <a href="log-workout.html" class="btn btn-outline">Log another</a>
      </div>
      <div id="recent-workouts"></div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>Active routine</h2>
      </div>
      <div id="active-routine"></div>
    </section>
  </div>
</main>

<footer class="site-foot">Aura Fitness — a client-side fitness tracker. Your data stays in this browser.</footer>

<a href="log-workout.html" class="fab" aria-label="Log a workout">+ Log workout</a>

<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
