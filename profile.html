<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Aura Fitness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1>Profile</h1>
      <p>Update your details and see your account at a glance.</p>
    </div>
  </div>

  <div class="dash-grid">
    <section class="panel">
      <div class="profile-head">
        <div class="avatar" id="avatar-initials"></div>
        <div>
          <h2 id="profile-name" style="margin-bottom:2px;"></h2>
          <p style="margin:0;" id="profile-username"></p>
        </div>
      </div>

      <div class="form-msg error" id="form-msg"></div>

      <form id="profile-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="firstName">First name<span class="req">*</span></label>
            <input type="text" id="firstName" required>
            <span class="field-error" id="firstName-error"></span>
          </div>
          <div class="field">
            <label for="lastName">Last name<span class="req">*</span></label>
            <input type="text" id="lastName" required>
            <span class="field-error" id="lastName-error"></span>
          </div>
        </div>
        <div class="field">
          <label for="email">Email<span class="req">*</span></label>
          <input type="email" id="email" required>
          <span class="field-error" id="email-error"></span>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" min="10" max="100">
            <span class="field-error" id="age-error"></span>
          </div>
          <div class="field">
            <label for="fitnessGoal">Fitness goal</label>
            <select id="fitnessGoal">
              <option>General Fitness</option>
              <option>Lose Weight</option>
              <option>Build Muscle</option>
              <option>Build Strength</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" min="100" max="250">
            <span class="field-error" id="height-error"></span>
          </div>
          <div class="field">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" min="30" max="300" step="0.1">
            <span class="field-error" id="weight-error"></span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="save-profile-btn">Save changes</button>
      </form>
    </section>

    <aside class="panel">
      <div class="panel-title"><h2>Account statistics</h2></div>
      <div id="account-stats"></div>
      <div class="panel-title" style="margin-top:22px;"><h2>Body mass index</h2></div>
      <div id="bmi-stat"></div>
    </aside>
  </div>
</main>

<footer class="site-foot">Aura Fitness — a client-side fitness tracker. Your data stays in this browser.</footer>

<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/validate.js"></script>
<script src="js/ui.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
