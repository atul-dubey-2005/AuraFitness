<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Aura Fitness</title>
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aura Fitness — log workouts, track progress and follow routines, right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2314171a%22/%3E%3Cpath d=%22M30 62 L46 62 L40 82 L74 46 L56 46 L64 18 Z%22 fill=%22%23c8ff3d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1>Profile</h1>
      <p>Update your details and see your account at a glance.</p>
    </div>
  </div>

  <div class="dash-grid">
    <section class="panel">
      <div class="profile-head">
        <div class="avatar" id="avatar-initials"></div>
        <div>
          <h2 id="profile-name" style="margin-bottom:2px;"></h2>
          <p style="margin:0;" id="profile-username"></p>
        </div>
      </div>

      <div class="form-msg success" id="form-msg"></div>

      <form id="profile-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" required>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" min="10" max="100">
          </div>
          <div class="field">
            <label for="fitnessGoal">Fitness goal</label>
            <select id="fitnessGoal">
              <option>General Fitness</option>
              <option>Lose Weight</option>
              <option>Build Muscle</option>
              <option>Build Strength</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" min="100" max="250">
          </div>
          <div class="field">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" min="30" max="300" step="0.1">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
    </section>

    <aside class="panel">
      <div class="panel-title"><h2>Account statistics</h2></div>
      <div id="account-stats"></div>
    </aside>
  </div>
</main>

<footer class="site-foot">Aura Fitness — a client-side fitness tracker. Your data stays in this browser.</footer>

<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
