<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise Library — Aura Fitness</title>
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aura Fitness — log workouts, track progress and follow routines, right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2314171a%22/%3E%3Cpath d=%22M30 62 L46 62 L40 82 L74 46 L56 46 L64 18 Z%22 fill=%22%23c8ff3d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1>Exercise library</h1>
      <p>Search and filter the movement bank used across every routine.</p>
    </div>
  </div>

  <div class="filters">
    <div class="field">
      <label for="search">Search</label>
      <input type="text" id="search" placeholder="Search by name…">
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option value="">All categories</option>
        <option>Strength</option>
        <option>Cardio</option>
        <option>Flexibility</option>
      </select>
    </div>
    <div class="field">
      <label for="muscle">Muscle group</label>
      <select id="muscle">
        <option value="">All muscle groups</option>
      </select>
    </div>
    <div class="field">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="">Any difficulty</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
    </div>
  </div>

  <div class="card-grid" id="exercise-grid"></div>
</main>

<footer class="site-foot">Aura Fitness — a client-side fitness tracker. Your data stays in this browser.</footer>

<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/exercise-icons.js"></script>
<script src="js/exercise-modal.js"></script>
<script src="js/exercises.js"></script>
</body>
</html>
