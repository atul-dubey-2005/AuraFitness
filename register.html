<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Aura Fitness</title>
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aura Fitness — log workouts, track progress and follow routines, right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2314171a%22/%3E%3Cpath d=%22M30 62 L46 62 L40 82 L74 46 L56 46 L64 18 Z%22 fill=%22%23c8ff3d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <section class="auth-side">
    <div class="mark">Aura<span>Fitness</span></div>
    <div class="pitch">
      <h1>Start your first log today.</h1>
      <p>Set a goal, pick a routine, and log your first workout in under two minutes.</p>
    </div>
    <div class="tally">
      <div><span class="n">3</span><span class="k">steps from sign-up to your first log</span></div>
      <div><span class="n">0</span><span class="k">cost, no card required</span></div>
    </div>
  </section>

  <section class="auth-form-side">
    <div class="auth-card">
      <h2>Create your account</h2>
      <p>It takes about a minute.</p>

      <div class="form-msg error" id="form-msg"></div>

      <form id="register-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" required>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" required>
          </div>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" required minlength="6">
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="6">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" min="10" max="100">
          </div>
          <div class="field">
            <label for="fitnessGoal">Fitness goal</label>
            <select id="fitnessGoal">
              <option>General Fitness</option>
              <option>Lose Weight</option>
              <option>Build Muscle</option>
              <option>Build Strength</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" min="100" max="250">
          </div>
          <div class="field">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" min="30" max="300" step="0.1">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="form-foot">Already have an account? <a href="index.html">Log in</a>.</p>
    </div>
  </section>
</div>

<script src="js/db.js"></script>
<script>
  if (AuraDB.getCurrentUser()) window.location.href = 'dashboard.html';

  const form = document.getElementById('register-form');
  const msg = document.getElementById('form-msg');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      msg.textContent = 'Those passwords don\'t match.';
      msg.classList.add('show');
      return;
    }

    const result = AuraDB.registerUser({
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      username: document.getElementById('username').value.trim(),
      email: document.getElementById('email').value.trim(),
      password,
      age: document.getElementById('age').value,
      height: document.getElementById('height').value,
      weight: document.getElementById('weight').value,
      fitnessGoal: document.getElementById('fitnessGoal').value,
    });

    if (!result.ok) {
      msg.textContent = result.error;
      msg.classList.add('show');
      return;
    }

    AuraDB.validateUser(result.user.username, password);
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
